[project]
name = "palimpsest"
version = "0.0.0"
description = "Project-lifecycle memory & knowledge curator — surfaces the decisions, intent, and relationships layered beneath a codebase."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

# Dependencies (graph driver, vector/RAG, MCP server, LLM client) are intentionally
# empty at seed stage. They are added at the first spike once the DB is chosen.
# See docs/VISION.md §"다음 단계".

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]
