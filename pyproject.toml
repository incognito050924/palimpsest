[project]
name = "palimpsest"
version = "0.0.0"
description = "Project-lifecycle memory & knowledge curator — surfaces the decisions, intent, and relationships layered beneath a codebase."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # Static Java extraction -> IR (n2-impl-extract). tree-sitter-java parses Java
    # to a concrete syntax tree; py-tree-sitter is the runtime binding.
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    # Static Kotlin extraction -> IR (n3-impl-kotlin-extract). Same tree-sitter
    # runtime; per-language grammar + queries/kotlin/*.scm (ADR-20260706 §결정6).
    "tree-sitter-kotlin>=1.1.0",
    # Static Python extraction -> IR. Same tree-sitter runtime; the >=0.23 pin
    # matches the tree-sitter>=0.23 runtime split API / ABI (per-language grammar
    # + queries/python/*.scm).
    "tree-sitter-python>=0.23",
    # Static Rust extraction -> IR (issue #12). Same tree-sitter runtime; per-language
    # grammar + queries/rust/*.scm (ADR-20260706 §결정6). de-Class'd: struct/enum/trait
    # -> Class, free fn -> Function, impl/trait method -> Method.
    "tree-sitter-rust>=0.23",
    # Static TS/JS/React/Svelte extraction -> IR (wi_260713lom). Shared
    # ecmascript core over per-grammar tree-sitter bindings; each grammar owns its
    # queries/<lang>/*.scm (ADR-20260706 §결정6). tsx grammar parses .tsx, the
    # typescript grammar parses .ts; svelte carries embedded <script> blocks.
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-svelte>=1.0.2",
    # Static Go extraction -> IR (issue #11). Same tree-sitter runtime; per-language
    # grammar + queries/go/*.scm (ADR-20260706 §결정6). Go has no classes: package
    # top-level funcs (function_declaration) + receiver methods (method_declaration).
    "tree-sitter-go>=0.23",
    # KG ingest (n3-impl-kg-ingest). Official Neo4j driver; raw Cypher, batched
    # UNWIND + MERGE. No neo4j-graphrag (defers LLM-synthesis paths, ac-3).
    "neo4j>=5.14",
]

# Graph driver (neo4j) added at the KG-ingest spike above. vector/RAG, MCP
# server, LLM client deps stay intentionally empty until their nodes land.
# See docs/VISION.md §"다음 단계".

[project.optional-dependencies]
# testcontainers[neo4j] stands up a hermetic Neo4j 5 Community container per
# test session (auto lifecycle); KG ingest tests run against that live bolt.
test = ["pytest>=8", "testcontainers[neo4j]>=4", "neo4j>=5.14"]
# The isolated generative curator (palimpsest.curate, ADR-20260706). The ONLY
# region that calls an LLM — kept OUT of the base install and the `test` group so
# the default pipeline (backfill/reconcile) and CI stay provider-free. Imported
# lazily, so `import palimpsest.curate` never pulls it in.
curate = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
